<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Tutor · explore the feedback cube</title><style>
:root{color-scheme:dark;font:12px Arial,sans-serif}*{box-sizing:border-box}body{margin:0;padding:17px;background:#141b20;color:#e4edf0}header,footer{display:flex;align-items:center;justify-content:space-between;gap:10px}header{font:9px monospace;letter-spacing:1px;color:#a4b9c5}.workspace{display:grid;grid-template-columns:1fr 145px;gap:16px;align-items:center}canvas{width:100%;height:225px;min-width:0;display:block}.controls{display:grid;gap:15px}label{display:block;font-size:11px}label span{display:flex;justify-content:space-between;gap:5px}output{font:10px monospace}input{width:100%;margin:9px 0 0;accent-color:#c2ebaa}#timing{accent-color:#ff8792}#duration{accent-color:#70bfff}button{font:11px Arial,sans-serif;padding:8px 11px;border:1px solid #476073;border-radius:4px;background:transparent;color:#e4edf0;cursor:pointer}button:focus-visible,input:focus-visible{outline:2px solid #c2ebaa;outline-offset:3px}footer{font-size:10px;color:#a7b9c4}footer p{margin:0;max-width:34ch;line-height:1.5}@media(max-width:390px){.workspace{grid-template-columns:1fr 118px;gap:7px}canvas{height:213px}label{font-size:10px}output{font-size:9px}}
</style></head><body><header><span>TUTOR / EXPLORE THE AXES</span><span>INTERACTIVE SKETCH</span></header><div class="workspace"><canvas role="img" aria-label="Three-dimensional feedback cube. Adjust sliders to move the point."></canvas><div class="controls"><label for="dynamics"><span>Dynamics <output id="dynamics-value">0</output></span><input id="dynamics" type="range" min="-32" max="32" value="0" step="1"></label><label for="timing"><span>Timing <output id="timing-value">0 ms</output></span><input id="timing" type="range" min="-250" max="250" value="0" step="5"></label><label for="duration"><span>Duration <output id="duration-value">0%</output></span><input id="duration" type="range" min="-100" max="100" value="0" step="5"></label></div></div><footer><p>Move the sliders. The centre matches the reference. Illustrative values, not a played assessment.</p><button id="reset" type="button">Reset ↺</button></footer><script>
// Same axis orientation as Tutor/cube.js. No score, measurement, MIDI or storage here.
const q=new URLSearchParams(location.search),token=q.get('prlToken'),canvas=document.querySelector('canvas'),g=canvas.getContext('2d');let w=200,h=225;const history=[];
const inputs=['dynamics','timing','duration'].map(id=>document.getElementById(id));
function draw(){if(!g)return;g.clearRect(0,0,w,h);const s=Math.min(w/4.3,(h-40)/3.4),cx=w/2,cy=h/2;const project=([x,y,z])=>[cx+(x-z)*.866*s,cy+((x+z)*.5-y)*s];
 const line=(a,b,color,width=1)=>{g.beginPath();g.strokeStyle=color;g.lineWidth=width;g.moveTo(...project(a));g.lineTo(...project(b));g.stroke();};
 for(let axis=0;axis<3;axis++)for(const a of [-1,1])for(const b of [-1,1]){const p=axis===0?[-1,a,b]:axis===1?[a,-1,b]:[a,b,-1],r=axis===0?[1,a,b]:axis===1?[a,1,b]:[a,b,1];line(p,r,'#738d9b66');}
 line([-1,-1,-1],[1,-1,-1],'#ff8792',2);line([-1,-1,-1],[-1,1,-1],'#c2ebaa',2);line([-1,-1,-1],[-1,-1,1],'#70bfff',2);
 g.beginPath();g.arc(cx,cy,9,0,Math.PI*2);g.strokeStyle='#d9eff177';g.lineWidth=1;g.stroke();for(let i=1;i<history.length;i++)line(history[i-1],history[i],`rgba(194,235,170,${i/history.length*.5})`,2);
 const point=[Number(inputs[1].value)/250,Number(inputs[0].value)/32,-Number(inputs[2].value)/100],p=project(point);g.beginPath();g.arc(...p,5,0,Math.PI*2);g.fillStyle='#eef8e4';g.fill();
 canvas.setAttribute('aria-label',`Illustrative cube: dynamics ${inputs[0].value}, onset timing ${inputs[1].value} milliseconds, key duration ${inputs[2].value} percent relative to reference.`);}
function update(){for(let i=0;i<inputs.length;i++){const v=Number(inputs[i].value),value=`${v>0?'+':''}${v}${i===1?' ms':i===2?'%':''}`;document.getElementById(inputs[i].id+'-value').textContent=value;inputs[i].setAttribute('aria-valuetext',value);}history.push([Number(inputs[1].value)/250,Number(inputs[0].value)/32,-Number(inputs[2].value)/100]);if(history.length>24)history.shift();draw();}
inputs.forEach(input=>input.addEventListener('input',update));document.getElementById('reset').addEventListener('click',()=>{inputs.forEach(x=>x.value=0);history.length=0;update();});
new ResizeObserver(()=>{w=canvas.clientWidth;h=canvas.clientHeight;const d=Math.min(devicePixelRatio||1,1.5);canvas.width=Math.round(w*d);canvas.height=Math.round(h*d);if(g)g.setTransform(d,0,0,d,0,0);draw();parent.postMessage({type:'prl:resize',token,height:document.body.scrollHeight},'*');}).observe(canvas);update();parent.postMessage({type:'prl:ready',token},'*');
</script></body></html>
